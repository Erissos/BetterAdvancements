leaderboard:
  title:
    global: "<gold><bold>Global Leaderboard</bold></gold>"
    session: "<yellow><bold>Session Leaderboard</bold></yellow>"
  mode:
    global: "Global"
    session: "Session"
  frame:
    material: GREEN_STAINED_GLASS_PANE
    name: "<dark_gray> "
  header:
    slot: 4
    global:
      material: NETHER_STAR
      glow: true
      title: "<gold><bold>Global Podium</bold></gold>"
      lore:
        - "<li><gray>Entries: <white>{entries}</white>"
        - "<li><gray>Mode: <yellow>{mode}</yellow>"
        - "<li><dark_gray>Top three players are shown in podium format."
    session:
      material: CLOCK
      glow: true
      title: "<yellow><bold>Session Podium</bold></yellow>"
      lore:
        - "<li><gray>Entries: <white>{entries}</white>"
        - "<li><gray>Mode: <yellow>{mode}</yellow>"
        - "<li><dark_gray>Top three players are shown in podium format."
  empty:
    slot: 22
    material: SPYGLASS
    glow: false
    title: "<aqua><bold>No Leaderboard Data</bold></aqua>"
    lore:
      - "<li><gray>No ranking entries are available yet."
      - "<li><dark_gray>Once players progress, this board fills automatically."
  podium-slots: [13, 11, 15]
  list-slots: [28, 29, 30, 31, 32, 33, 34]
  cards:
    title: "{badge} <white>{player}</white>"
    badges:
      1: "<gold><bold>♛ #1 Champion</bold></gold>"
      2: "<white><bold>♜ #2 Vanguard</bold></white>"
      3: "<color:#d99a5e><bold>♞ #3 Trailblazer</bold></color>"
      4: "<aqua><bold>#4 Route Runner</bold></aqua>"
      5: "<aqua><bold>#5 Route Runner</bold></aqua>"
      6: "<aqua><bold>#6 Route Runner</bold></aqua>"
      7: "<aqua><bold>#7 Route Runner</bold></aqua>"
      8: "<aqua><bold>#8 Route Runner</bold></aqua>"
      9: "<aqua><bold>#9 Route Runner</bold></aqua>"
      10: "<aqua><bold>#10 Route Runner</bold></aqua>"
    lore:
      - "<li><gray>Completed: <white>{completed}</white>"
      - "<li><gray>Progression: <yellow>{progression}%</yellow>"
      - "<li><gray>Points: <green>{points}</green>"
      - "<li><gray>Highest Tier: <aqua>{highest_tier}</aqua>"
    podium-extra:
      - "<li><dark_gray>This card occupies a podium showcase slot."
  footer:
    global:
      slot: 48
      material: PAPER
      title: "<green><bold>Global Board</bold></green>"
      lore:
        - "<li><gray>Switch to all-time rankings."
    back:
      slot: 49
      material: BARRIER
      glow: false
      title: "<red><bold>Back to Main Menu</bold></red>"
      lore:
        - "<li><gray>Return to the quest hub."
    session:
      slot: 50
      material: CLOCK
      title: "<gold><bold>Session Board</bold></gold>"
      lore:
        - "<li><gray>Switch to the current session rankings."
    notes:
      slot: 53
      material: BOOK
      glow: false
      title: "<aqua><bold>Leaderboard Notes</bold></aqua>"
      lore:
        - "<li><gray>Slots #1-#3 use the podium layout."
        - "<li><gray>Other players appear in the tactical row below."