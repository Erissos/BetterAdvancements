main:
  title: "<gray><bold>Better Advancements</bold></gray>"
  frame:
    material: BLACK_STAINED_GLASS_PANE
    name: "<dark_gray> "
  background:
    material: GRAY_STAINED_GLASS_PANE
    name: "<dark_gray> "
    glow: false
  fillers: []
  profile:
    slot: 4
    glow: false
    title: "<gold><bold>Player Profile</bold></gold>"
    lore:
      - "<li><gray>Name: <white>{player}</white>"
      - "<li><gray>Total Completion: <yellow>{completion}%</yellow>"
      - "<li><gray>Points: <green>{points}</green>"
      - "<li><gray>Top Tier: <aqua>{highest_tier}</aqua>"
      - "<li><dark_gray>Overview of your progression."
  next-target:
    slot: 3
    active:
      material: EMERALD
      glow: true
      title: "<yellow><bold>Next Quest Target</bold></yellow>"
      lore:
        - "<li><gray>Quest: <white>{target}</white>"
        - "<li><gray>Tier: <aqua>{tier}</aqua>"
        - "<li><gray>Category: <gold>{category}</gold>"
        - "<li><gray>Goal: <green>{goal}</green>"
        - "<li><dark_gray>Click to jump directly into this route."
    empty:
      material: TOTEM_OF_UNDYING
      glow: true
      title: "<green><bold>All Quests Complete</bold></green>"
      lore:
        - "<li><gray>You cleared every tracked advancement."
        - "<li><gray>Your quest book is fully completed."
        - "<li><dark_gray>Browse tiers below to admire the route map."
  challenge:
    slot: 5
    material: CRAFTING_TABLE
    glow: false
    title: "<gold><bold>Challenge Board</bold></gold>"
    empty-lore:
      - "<li><gray>No live daily or weekly challenges loaded."
      - "<li><dark_gray>The board will populate automatically on rotation."
    entry-title: "<li><yellow>{type}</yellow><gray>: <white>{title}</white>"
    entry-description: "<li><dark_gray>{description}"
    entry-reward: "<li><gray>Reward: <green>{reward} Points</green>"
    footer-lore:
      - "<li><dark_gray>Challenges refresh automatically and mimic event boards."
  tiers:
    order: [novice, starter, skilled, expert, master, mythic]
    auto-slots: [20, 21, 22, 23, 24]
    state:
      completed:
        - ""
        - "<green><bold>Status: Completed</bold></green>"
      locked:
        - ""
        - "<red><bold>Status: Locked</bold></red>"
        - "<gray>Complete <white>{previous_tier}</white><gray> first.</gray>"
      available:
        - ""
        - "<yellow><bold>Status: Available</bold></yellow>"
    novice:
      aliases: [TIER_1, novice, starter]
      weight: 1
      display-name: "Novice"
      icon: GRASS_BLOCK
      name: "<green><bold>Novice Quests</bold></green>"
      lore:
        - "<li><gray>Completion: <yellow>{completion}%</yellow>"
        - "<li><gray>Unlocked: <white>{unlocked}/{total}</white>"
        - "<li><gray>Rare Clears: <light_purple>{rare}</light_purple>"
        - "<li><dark_gray>Perfect for early game progression."
    skilled:
      aliases: [TIER_2, skilled]
      weight: 2
      display-name: "Skilled"
      icon: IRON_PICKAXE
      name: "<yellow><bold>Skilled Quests</bold></yellow>"
      lore:
        - "<li><gray>Completion: <yellow>{completion}%</yellow>"
        - "<li><gray>Unlocked: <white>{unlocked}/{total}</white>"
        - "<li><gray>Rare Clears: <light_purple>{rare}</light_purple>"
        - "<li><dark_gray>More demanding routes and stronger rewards."
    expert:
      aliases: [TIER_3, expert]
      weight: 3
      display-name: "Expert"
      icon: DIAMOND
      name: "<aqua><bold>Expert Quests</bold></aqua>"
      lore:
        - "<li><gray>Completion: <yellow>{completion}%</yellow>"
        - "<li><gray>Unlocked: <white>{unlocked}/{total}</white>"
        - "<li><gray>Rare Clears: <light_purple>{rare}</light_purple>"
        - "<li><dark_gray>Mid-game prestige and exploration routes."
    master:
      aliases: [TIER_4, master]
      weight: 4
      display-name: "Master"
      icon: NETHERITE_INGOT
      name: "<light_purple><bold>Master Quests</bold></light_purple>"
      lore:
        - "<li><gray>Completion: <yellow>{completion}%</yellow>"
        - "<li><gray>Unlocked: <white>{unlocked}/{total}</white>"
        - "<li><gray>Rare Clears: <light_purple>{rare}</light_purple>"
        - "<li><dark_gray>Elite tasks with premium progression."
    mythic:
      aliases: [TIER_5, mythic]
      weight: 5
      display-name: "Mythic"
      icon: DRAGON_HEAD
      name: "<red><bold>Mythic Quests</bold></red>"
      lore:
        - "<li><gray>Completion: <yellow>{completion}%</yellow>"
        - "<li><gray>Unlocked: <white>{unlocked}/{total}</white>"
        - "<li><gray>Rare Clears: <light_purple>{rare}</light_purple>"
        - "<li><dark_gray>Endgame showpiece quests and signature rewards."
  stats:
    slot: 30
    material: NETHER_STAR
    glow: false
    title: "<aqua><bold>Statistics</bold></aqua>"
    lore:
      - "<li><gray>Open your personal quest analytics."
      - "<li><gray>See category spread, tier progress and totals."
      - "<li><dark_gray>Styled after Hypixel profile menus."
  leaderboard:
    slot: 31
    material: PLAYER_HEAD
    glow: false
    title: "<green><bold>Leaderboards</bold></green>"
    lore:
      - "<li><gray>Browse global and session rankings."
      - "<li><gray>See the top advancement grinders instantly."
      - "<li><dark_gray>Opens the podium board."
  locale:
    slot: 32
    material: BOOK
    glow: false
    title: "<light_purple><bold>Language Settings</bold></light_purple>"
    lore:
      - "<li><gray>Current Locale: <white>{language}</white>"
      - "<li><gray>All GUI and notifications use this language."
      - "<li><dark_gray>Use /ba language code to switch."
  overview:
    slot: 49
    material: SPYGLASS
    glow: false
    title: "<gold><bold>Quest Overview</bold></gold>"
    lore:
      - "<li><gray>Completed Nodes: <white>{completed}</white>"
      - "<li><gray>Rare Unlocks: <light_purple>{rare}</light_purple>"
      - "<li><gray>Active Challenges: <green>{challenges}</green>"
      - "<li><dark_gray>A compact dashboard inspired by server hub menus."

tier:
  title: "<gold><bold>{tier_name}</bold></gold> <gray>⟡</gray> <yellow>Quest Chain</yellow>"
  frame:
    material: BLACK_STAINED_GLASS_PANE
    name: "<dark_gray> "
  background:
    material: GRAY_STAINED_GLASS_PANE
    name: "<dark_gray> "
    glow: false
  blocked-slots: [4, 45, 46, 47, 48, 49, 50, 51, 52, 53]
  overview:
    slot: 4
    glow: true
    title: "<gold><bold>{tier_name} Overview</bold></gold>"
    lore:
      - "<li><gray>Completion: <yellow>{completion}%</yellow>"
      - "<li><gray>Total Nodes: <white>{total}</white>"
      - "<li><gray>Unlocked: <green>{unlocked}</green>"
      - "<li><gray>Rare Clears: <light_purple>{rare}</light_purple>"
      - "<li><dark_gray>Follow the connectors like a quest path."
  node:
    hidden-title: "<gray><bold>Hidden Quest</bold></gray>"
    hidden-description: "<dark_gray>This objective is still secret."
    materials:
      completed: LIME_STAINED_GLASS_PANE
      locked: GRAY_STAINED_GLASS_PANE
    lore:
      - ""
      - "<gray>{description}"
      - ""
      - "<gold>Objective</gold><dark_gray>: <yellow>{objective}</yellow>"
      - "<green>Progress</green><dark_gray>: <white>{progress}</white><dark_gray>/</dark_gray><yellow>{target}</yellow>"
      - "<aqua>Category</aqua><dark_gray>: <white>{category}</white>"
      - "<light_purple>Rarity</light_purple><dark_gray>: <white>{rarity}</white>"
      - "<green>Rewards</green><dark_gray>: <white>{rewards}</white>"
      - "<gold>Points</gold><dark_gray>: <green>{points}</green>"
    requires-format: "<red>Requires</red><dark_gray>: <white>{requirements}</white>"
    unlocks-format: "<aqua>Unlocks</aqua><dark_gray>: <white>{unlocks}</white>"
    state:
      completed: "<green><bold>Completed quest node</bold></green>"
      unlocked: "<yellow><bold>Unlocked and ready</bold></yellow>"
      locked: "<gray><bold>Locked behind earlier quests</bold></gray>"
  connectors:
    title-completed: "<green><bold>{direction} Completed Route</bold></green>"
    title-locked: "<aqua><bold>{direction} Dependency Route</bold></aqua>"
    detail-completed: "<li><gray>This route is already satisfied."
    detail-locked: "<li><gray>This route unlocks the next quest node."
    direction-lore: "<li><dark_gray>Direction: {direction}"
    materials:
      completed: LIME_STAINED_GLASS_PANE
      vertical: CYAN_STAINED_GLASS_PANE
      horizontal-forward: LIGHT_BLUE_STAINED_GLASS_PANE
      horizontal-back: BLUE_STAINED_GLASS_PANE
    symbols:
      right: "→"
      left: "←"
      down: "↓"
      up: "↑"
      point: "•"
  navigation:
    previous:
      slot: 45
      active:
        material: ARROW
        glow: false
        title: "<aqua><bold>Previous Tier: {tier_name}</bold></aqua>"
        lore:
          - "<li><gray>Jump back to the previous quest lane."
      empty:
        material: BARRIER
        glow: false
        title: "<gray><bold>No Previous Tier</bold></gray>"
        lore:
          - "<li><gray>You are already at the first quest lane."
    legend-completed:
      slot: 46
      material: LIME_STAINED_GLASS_PANE
      glow: false
      title: "<green><bold>Completed</bold></green>"
      lore:
        - "<li><gray>Quest nodes you have already finished."
    legend-unlocked:
      slot: 47
      material: LIGHT_BLUE_STAINED_GLASS_PANE
      glow: false
      title: "<aqua><bold>Unlocked</bold></aqua>"
      lore:
        - "<li><gray>Quest nodes available right now."
    legend-locked:
      slot: 48
      material: GRAY_STAINED_GLASS_PANE
      glow: false
      title: "<gray><bold>Locked</bold></gray>"
      lore:
        - "<li><gray>Quest nodes waiting for dependencies."
    back:
      slot: 49
      material: BARRIER
      glow: false
      title: "<red><bold>Back to Main Menu</bold></red>"
      lore:
        - "<li><gray>Return to the quest hub."
    horizontal:
      slot: 50
      title: "<aqua><bold>Horizontal Route</bold></aqua>"
      detail: "<li><gray>Links quest nodes in the same row."
    vertical:
      slot: 51
      title: "<aqua><bold>Vertical Route</bold></aqua>"
      detail: "<li><gray>Shows the chain dropping into another row."
    focus:
      slot: 52
      material: COMPASS
      glow: false
      title: "<gold><bold>Route Focus</bold></gold>"
      active-lore:
        - "<li><gray>Focus Quest: <white>{target}</white>"
        - "<li><gray>Goal: <green>{goal}</green>"
        - "<li><gray>Category: <yellow>{category}</yellow>"
        - "<li><dark_gray>Best immediate target in this lane."
      empty-lore:
        - "<li><gray>No immediate quest target is open here."
        - "<li><dark_gray>Either this lane is complete or gated elsewhere."
    next:
      slot: 53
      active:
        material: ARROW
        glow: false
        title: "<gold><bold>Next Tier: {tier_name}</bold></gold>"
        lore:
          - "<li><gray>Jump ahead to the next quest lane."
      empty:
        material: BARRIER
        glow: false
        title: "<gray><bold>No Next Tier</bold></gray>"
        lore:
          - "<li><gray>You are viewing the final endgame lane."

