# Desperis / erisos — optional live suite objectives
# These examples are disabled. Existing achievements.yml is never rewritten.
# Enable deliberately, then /ba reload. IDs, tier slots, navigation and dependencies are checked first.
# The default placements use free slots in the bundled five-tier layout. Customized layouts may need other slots.
# source + event are required. Optional flat detail conditions (material, boss, dungeon, etc.) match exactly.
# No history/backfill. Dependencies and ordinary completion/reward rules apply; no administrative grant.
# The tier GUI is one page: gui.page must remain 0. Slots are real 9-column inventory cells.
enabled: false
