plugins {
    id 'java'
}

group = 'dev.erissos'
version = '1.0.0-SNAPSHOT'

configurations {
    bundled
    implementation.extendsFrom(bundled)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'placeholderapi'
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.6'

    bundled 'com.zaxxer:HikariCP:5.1.0'
    bundled 'org.xerial:sqlite-jdbc:3.45.3.0'
    bundled 'com.mysql:mysql-connector-j:8.4.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

jar {
    archiveBaseName = 'BetterAdvancements'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from {
        configurations.bundled.collect { dependency ->
            dependency.isDirectory() ? dependency : zipTree(dependency)
        }
    }

    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}